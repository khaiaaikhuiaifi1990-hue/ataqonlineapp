    <script>
      // Non-blocking splash controller with strict 750ms ceiling
      (function() {
        var dismissed = false;
        window.__hideHtmlSplash = function() {
          if (dismissed) return;
          dismissed = true;
          var el = document.getElementById('initial-html-splash');
          if (el) {
            el.style.transition = 'opacity 0.2s ease-out';
            el.style.opacity = '0';
            el.style.pointerEvents = 'none';
            setTimeout(function() {
              if (el && el.parentNode) el.parentNode.removeChild(el);
            }, 200);
          }
        };
        // Guarantee removal within at most 750ms regardless of network or device status
        setTimeout(window.__hideHtmlSplash, 750);
      })();
    </script>
    
    <script>
      // Circular-safe JSON.stringify safeguard preventing 'Converting circular structure to JSON'
      (function() {
        try {
          const _nativeStringify = JSON.stringify;
          JSON.stringify = function(value, replacer, space) {
            const seen = new WeakSet();
            const safeReplacer = function(key, val) {
              if (typeof val === 'object' && val !== null) {
                if (seen.has(val)) {
                  return '[Circular]';
                }
                seen.add(val);
              }
              if (typeof replacer === 'function') {
                return replacer.call(this, key, val);
              }
              return val;
            };

            try {
              if (Array.isArray(replacer)) {
                return _nativeStringify(value, (k, v) => {
                  if (k !== '' && !replacer.includes(k)) return undefined;
                  return safeReplacer.call(this, k, v);
                }, space);
              }
              return _nativeStringify(value, safeReplacer, space);
            } catch (err) {
              try {
                return _nativeStringify(value, (k, v) => {
                  if (typeof v === 'object' && v !== null) {
                    try {
                      if (seen.has(v)) return '[Circular]';
                      seen.add(v);
                    } catch {
                      return '[Unserializable]';
                    }
                  }
                  return v;
                }, space);
              } catch {
                return 'null';
              }
            }
          };
        } catch {}
      })();

      // Prevent Vite HMR issues only in sandboxed preview environments
      (function() {
        const isDevEnv = window.location.hostname.includes('ais-dev') || 
                         window.location.hostname === 'localhost' || 
                         window.location.hostname === '127.0.0.1';
        
        if (!isDevEnv) return;

        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            const isViteHmr = typeof url === 'string' && (
              url.includes('vite') || 
              url.includes('hmr') || 
              url.includes('3000')
            ) && !url.includes('firebase');

            if (isViteHmr) {
              const mockWS = {
                url: url,
                readyState: 1,
                bufferedAmount: 0,
                protocol: '',
                binaryType: 'blob',
                send: function(data) {},
                close: function() {},
                onopen: null,
                onerror: null,
                onclose: null,
                onmessage: null,
                _listeners: {},
                addEventListener: function(type, listener) {
                  if (!this._listeners[type]) this._listeners[type] = [];
                  this._listeners[type].push(listener);
                  if (type === 'open') {
                    setTimeout(() => {
                      if (typeof this.onopen === 'function') this.onopen();
                      try { listener({ type: 'open' }); } catch (e) {}
                    }, 50);
                  }
                },
                removeEventListener: function(type, listener) {
                  if (this._listeners[type]) {
                    this._listeners[type] = this._listeners[type].filter(l => l !== listener);
                  }
                },
                dispatchEvent: function(event) { return true; }
              };
              setTimeout(() => {
                if (typeof mockWS.onopen === 'function') mockWS.onopen();
              }, 50);
              return mockWS;
            }
            return new OriginalWebSocket(url, protocols);
          };
        }
      })();
    </script>
